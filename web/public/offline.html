<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d6f42">
<title>No connection — Yash Poultry Farm</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2733; background: #f4f6f8; line-height: 1.45; }
  main { max-width: 24rem; background: #fff; border: 1px solid #d8dee6; border-radius: 12px; padding: 1.5rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.3rem; margin: 0.8rem 0 0.4rem; }
  p { margin: 0 0 1.2rem; color: #475569; }
  button { min-height: 52px; min-width: 160px; padding: 0 1.4rem; font: inherit; font-size: 1.1rem; font-weight: 600; color: #fff; background: #1d6f42; border: 0; border-radius: 10px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #0b3d22; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>No connection</h1>
  <p>No connection. Your data is safe. Try again when you are online.</p>
  <button type="button" id="retry">Retry</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
